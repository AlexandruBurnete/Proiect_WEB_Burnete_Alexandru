<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact – Alexandru Burnete</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg-blur bg-one"></div>
  <div class="bg-blur bg-two"></div>
  <header class="site-header">
    <nav class="topbar" aria-label="Navigare principală">
      <a class="brand" href="index.html">Alexandru Burnete</a>
      <button class="hamburger" type="button" aria-label="Deschide meniul" aria-expanded="false" aria-controls="nav-menu">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-menu" id="nav-menu">
        <li><a class="nav-link" href="index.html">Acasă</a></li>
        <li><a class="nav-link" href="about.html">Despre mine</a></li>
        <li><a class="nav-link" href="projects.html">Proiecte</a></li>
        <li><a class="nav-link" href="contact.html" aria-current="page">Contact</a></li>
      </ul>
    </nav>
  </header>
  <main class="main">
    <h1 class="page-title">Contact</h1>
    <p class="page-intro">Completează formularul. Câmpurile sunt verificate pe măsură ce scrii.</p>

    <form id="contactForm" class="form-card reveal" novalidate>
      <div class="field">
        <label for="name">Nume</label>
        <input id="name" name="name" type="text" autocomplete="name" required aria-describedby="name-error">
        <span class="error" id="name-error"></span>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required aria-describedby="email-error">
        <span class="error" id="email-error"></span>
      </div>
      <div class="field">
        <label for="phone">Telefon <span class="hint">(opțional)</span></label>
        <input id="phone" name="phone" type="tel" autocomplete="tel" aria-describedby="phone-error">
        <span class="error" id="phone-error"></span>
      </div>
      <div class="field">
        <label for="message">Mesaj</label>
        <textarea id="message" name="message" rows="6" required aria-describedby="message-error"></textarea>
        <span class="counter" id="counter">0 / 1000</span>
        <span class="error" id="message-error"></span>
      </div>
      <button class="btn primary" type="submit">Trimite mesajul</button>
      <p class="success" id="formSuccess" role="status" hidden>Mesajul a fost trimis. Mulțumesc!</p>
    </form>
  </main>
  <footer class="site-footer">
  </footer>
  <script src="js/script.js"></script>
</body>
</html>
